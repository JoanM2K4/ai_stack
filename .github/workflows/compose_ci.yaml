# This is a basic workflow to help you get started with Actions

name: Lint Docker Compose
# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request event
  push:
    branches:
      - main
      - dev
  pull_request: 
    branches: 
      - main
      - dev

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  
  test_compose:
    runs-on: ubuntu/latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose
        run: |
          docker compose version
          docker compose -f docker-compose.yml config

      - name: Yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: docker-compose.yml

      - name: DCLint GitHub Action
        # You may pin to the exact commit or the version.
        # uses: docker-compose-linter/dclint-github-action@18659f6a7956706cb67cf9c1ad5e55f4352cbc17
        uses: docker-compose-linter/dclint-github-action@v1.6.0
        with:
          # Path(s) to file(s) or directory(ies) to lint (space-separated)
          path: .
          # Recursively search directories
          formatter: github
          # Maximum number of warnings allowed before failure
          max-warnings: 0

      - name: Hadolint Action
        # You may pin to the exact commit or the version.
        # uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5
        uses: hadolint/hadolint-action@v3.3.0
        with:
          # The path to the Dockerfile to lint
          dockerfile: Dockerfile

          # Search for specified dockerfile recursively, from the project root
          recursive: true

          # The output format, one of [tty (default) | json | checkstyle |
          # codeclimate | gitlab_codeclimate | codacy | sarif]
          format: tty
          


services:
  ollama:
    image: jjsotom2k4/ollama-ai:${VERSION}
    container_name: ollama
    environment:
          OLLAMA_MODELS: ${OLLAMA_MODELS}
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-net
    restart: unless-stopped

  postgres:
    image: jjsotom2k4/postgres-ai:${VERSION}
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EMBEDDING_SIZE: ${EMBEDDING_SIZE}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  flowise:
    image: flowiseai/flowise:latest
    container_name: flowise
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      PORT: ${FLOWISE_PORT}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA}
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}

      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    ports:
      - "${FLOWISE_PORT}:${FLOWISE_PORT}"
    volumes:
      - flowise_data:/root/.flowise
    networks:
      - ai-net
    restart: unless-stopped

  postgres_n8n:
      image: postgres:16
      container_name: postgres_n8n
      environment:
        POSTGRES_USER: ${N8N_POSTGRES_USER}
        POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD}
        POSTGRES_DB: ${N8N_POSTGRES_DB}
      ports:
        - "${N8N_POSTGRES_PORT}:5432"
      volumes:
        - postgres_n8n_data:/var/lib/postgresql/data
      networks:
        - ai-net
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${N8N_POSTGRES_USER} -d ${N8N_POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 10

  n8n:
      image: docker.n8n.io/n8nio/n8n
      container_name: n8n
      depends_on:
        postgres_n8n:
          condition: service_healthy
      ports:
        - "${N8N_PORT}:5678"
      environment:
        GENERIC_TIMEZONE: ${N8N_TIMEZONE}
        TZ: ${N8N_TIMEZONE}
        N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
        N8N_RUNNERS_ENABLED: "true"

        DB_TYPE: postgresdb
        DB_POSTGRESDB_HOST: postgres_n8n
        DB_POSTGRESDB_PORT: 5432
        DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB}
        DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER}
        DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD}
        DB_POSTGRESDB_SCHEMA: ${N8N_POSTGRES_SCHEMA}
      volumes:
        - n8n_data:/home/node/.n8n
      networks:
        - ai-net
      restart: unless-stopped

networks:
  ai-net:
    driver: bridge

volumes:
  ollama_data:
  postgres_data:
  flowise_data:
  postgres_n8n_data:
  n8n_data: